name: Fiabiliser l'interface Vaut le Coup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch server.js de façon idempotente
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('server.js')
          s = p.read_text()
          original = s

          # Confiance : 0.95 doit devenir 95/100, et le score doit rester clairement
          # un score de lecture, jamais un jugement sur l'état du véhicule.
          if 'function readingConfidence(vehicle)' not in s:
              marker = 'function showAnalysis(vehicle) {'
              helper = '''function readingConfidence(vehicle) {
            const raw = Number(vehicle?.confidence);
            const ai = Number.isFinite(raw) ? (raw <= 1 ? raw * 100 : raw) : 0;
            const essential = [vehicle?.make, vehicle?.model, vehicle?.year, vehicle?.mileage_km, vehicle?.price_eur, vehicle?.energy, vehicle?.gearbox];
            const complete = essential.filter(v => v !== null && v !== undefined && v !== '').length / essential.length * 100;
            return Math.max(0, Math.min(100, Math.round(ai * 0.7 + complete * 0.3)));
          }

          '''
              if marker not in s:
                  raise SystemExit('ERREUR: showAnalysis introuvable')
              s = s.replace(marker, helper + marker, 1)

          # Remplacement volontairement large et stable : on ne dépend plus de la mise en forme.
          s, n = re.subn(r'escapeHtml\(vehicle\.confidence\s*\?\?\s*0\)', 'readingConfidence(vehicle)', s, count=1)
          if n == 0:
              raise SystemExit('ERREUR: affichage confidence introuvable')

          old = '"Confiance de lecture : " +\n    readingConfidence(vehicle) +\n    "/100</p>" +'
          if old in s:
              s = s.replace(old, '"🔎 Fiabilité des informations extraites : " +\n    readingConfidence(vehicle) +\n    "/100</p>" +\n\n    \'<p class="muted">Score de qualité de lecture des informations visibles — il ne juge pas le véhicule.</p>\' +', 1)
          elif 'Fiabilité des informations extraites' not in s:
              # Le texte peut être sur une seule ligne dans une version précédente.
              s = s.replace('"Confiance de lecture : " +', '"🔎 Fiabilité des informations extraites : " +', 1)

          # Bloc de négociation : toujours présent et sans inventer de montant.
          if 'Axes d’amélioration / négociation' not in s:
              needle = '    "<h3>Comparables utilisés</h3>" +'
              block = '''    '<div class="result"><h3>💬 Axes d’amélioration / négociation</h3><p>' +
    escapeHtml((marketData.comparables || []).length >= 3
      ? "Utilisez les comparables compatibles comme base. Vérifiez factures, entretien, contrôle technique, pneus, freins et frais à venir. Tout défaut réel ou justificatif manquant peut servir d’argument pour négocier."
      : "L’échantillon de marché est trop limité pour fixer un montant de négociation fiable. Vérifiez l’historique, le contrôle technique et les frais à venir ; négociez uniquement à partir d’éléments vérifiables.") +
    '</p></div>' +

    "<h3>📊 Comparables utilisés</h3>" +'''
              if needle in s:
                  s = s.replace(needle, block, 1)

          # Validation : le résultat doit contenir les éléments critiques.
          required = ['readingConfidence(vehicle)', 'Fiabilité des informations extraites']
          for item in required:
              if item not in s:
                  raise SystemExit(f'ERREUR: élément critique absent: {item}')

          if s == original:
              print('Aucun changement nécessaire')
          else:
              p.write_text(s)
              print('server.js patché')
          PY

      - name: Valider la syntaxe
        run: node --check server.js

      - name: Commit si nécessaire
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js .github/workflows/patch-ui.yml
          git commit -m "Fiabiliser confiance et négociation"
          git push
